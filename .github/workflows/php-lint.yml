name: PHP Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate PHP files
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Validate Python syntax
        run: python3 -m py_compile tools/gerar_fotos_word.py

      - name: Install photo module dependencies
        run: python3 -m pip install -r tools/requirements-fotos-word.txt

      - name: Validate photo generator imports
        run: python3 tools/gerar_fotos_word.py --help
